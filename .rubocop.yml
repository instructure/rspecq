AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Fixture suites, deliberately written badly (global vars, flaky examples,
    # deprecation warnings) for the tests to exercise.
    - test/sample_suites/**/*

Metrics:
  Enabled: false

Style/WordArray:
  EnforcedStyle: brackets

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/SpecialGlobalVars:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/NegatedIf:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Layout/FirstArrayElementIndentation:
  Enabled: false

Layout/ArgumentAlignment:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

# Dev deps stay in the gemspec: the CI matrix pins rspec-core/redis there via
# env vars, and Gemfile.lock is gitignored.
Gemspec/DevelopmentDependencies:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

# Would rename the public Queue#is_requeue.
Naming/PredicatePrefix:
  Enabled: false

Style/Documentation:
  Enabled: false
